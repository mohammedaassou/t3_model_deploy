services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.infer
    image: iris-api:redis
    environment:
      REDIS_HOST: base
    depends_on:
      base:
        condition: service_healthy
    ports:
      - "8000:8000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  base:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
